# ============================================================
# 前端容器内的 Nginx 配置（注意：不是网关，网关是 deploy/nginx/nginx.conf）
# ------------------------------------------------------------
# 这个 Nginx 只干两件事：
#   1. 托管 `npm run build` 打包出的静态文件（dist/）；
#   2. 解决 Vue Router history 模式的"刷新 404"问题：
#      SPA 只有一个 index.html，/chat 这种路径在磁盘上并不存在，
#      直接刷新 /chat 时 Nginx 找不到文件会 404。
#      try_files 的最后一个参数 /index.html 表示"找不到就回退到
#      首页"，让前端路由接管，页面就正常了。
# ============================================================
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;  # 对应 Dockerfile 里 COPY 进来的 dist 产物
    index index.html;

    # SPA 路由回退：依次找 文件 → 目录 → 都找不到就回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存：带 hash 指纹的构建产物内容不变，可以放心缓存 30 天，
    # immutable 告诉浏览器"这文件永远不会变"，连协商请求都不用发
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
