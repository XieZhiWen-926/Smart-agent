# ==============================================
# Nginx 网关配置 - 统一入口 + 负载均衡 + SSE优化
# ------------------------------------------------------------
# 这是整个系统对外的"大门"（:80）。用户浏览器只跟它打交道：
#   - 静态页面  → 转发给 frontend 容器
#   - /api/...  → 转发给 backend 容器（可配多台做负载均衡）
#
# 小白最该记住的三件事：
# 1. SSE 流式聊天必须 proxy_buffering off！
#    Nginx 默认会把后端响应"攒一攒"再发给浏览器，普通接口无所谓，
#    但 SSE 是"来一段发一段"，一缓冲打字机效果就变成了"憋半天一次性蹦出来"。
# 2. SSE 长连接要调大 proxy_read_timeout，否则聊到一半被 Nginx 掐断。
# 3. upstream 里的 keepalive 让 Nginx 复用到后端的连接，高并发下
#    避免每个请求都重新握手（省 CPU、降延迟）。
# ==============================================

worker_processes auto;    # worker 进程数 = CPU 核数，吃满多核
events {
    worker_connections 4096;  # 单进程最大连接数，并发上限 ≈ 核数 × 4096
    use epoll;                # Linux 上最高效的 IO 多路复用模型
    multi_accept on;          # 一次尽量多接几个新连接，减少唤醒次数
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # 基础优化
    sendfile        on;   # 静态文件走零拷贝，不经过用户态，省 CPU
    tcp_nopush      on;
    tcp_nodelay     on;   # 小包立即发送不攒包，对 SSE 实时性友好
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_max_body_size 50m;  # 允许上传大 CSV 文件（默认只有 1m，会被拒）

    # Gzip 压缩：文本类响应压小再传，省带宽（JS/CSS/JSON 能小 70%+）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # ---------- 后端负载均衡组 ----------
    # upstream：定义一组后端。多台 backend 时请求会被轮流分发（负载均衡），
    # 配合后端无状态设计（JWT 鉴权），加机器就能线性扩容。
    upstream backend_servers {
        server backend:8000;  # "backend" 是 compose 里的服务名
        # 多实例时可加：server backend2:8000;
        keepalive 32;  # 与后端保持 32 条长连接复用，避免反复建连
    }

    # ---------- 前端 ----------
    upstream frontend_servers {
        server frontend:80;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # ---------- API 路由（转发到后端）----------
        location /api/ {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;   # 用 HTTP/1.1 才能配合 keepalive 长连接
            proxy_set_header Host $host;
            # 把真实客户端信息透传给后端（日志、限流都靠它）
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";  # 清空 Connection 头 = 启用 keepalive 复用

            # 普通 API 超时
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
        }

        # ---------- SSE 流式聊天（关键：关闭缓冲！）----------
        # Nginx 的 location 匹配规则：更长的前缀优先，所以
        # /api/chat/stream 会命中本段而不是上面的 /api/ 段。
        location /api/chat/stream {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";

            # 【核心】SSE 三件套：
            # proxy_buffering off  —— 收到后端数据立刻转发给浏览器，不攒着。
            #                        这是打字机效果能"流"起来的前提！
            # proxy_cache off      —— 流式响应绝不能缓存
            # chunked 编码         —— 响应长度未知，边生成边传输
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            # SSE 长连接超时要大：大模型回答可能要几十秒，
            # 太短会中途被 Nginx 断连（前端看到回答说一半没了）
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # ---------- 前端静态资源 ----------
        location / {
            proxy_pass http://frontend_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
        }

        # ---------- 健康检查 ----------
        # 给负载均衡器/监控系统探活用的轻量接口，不打访问日志（会刷屏）
        location = /health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
}
